<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050608" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Suivi TV" />
    <title>Suivi TV</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main id="app" class="app-view" aria-live="polite"></main>
      <nav class="bottom-nav" aria-label="Navigation principale">
        <span class="nav-slider" aria-hidden="true"></span>
        <button class="nav-item is-active" data-route="home" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 11.3 12 4l8 7.3v8.2a.5.5 0 0 1-.5.5h-5v-5.7h-5V20h-5a.5.5 0 0 1-.5-.5v-8.2Z"/></svg>
          </span>
          <span>Accueil</span>
        </button>
        <button class="nav-item" data-route="library" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 5.5h14v3H5v-3Zm0 5h14v3H5v-3Zm0 5h14v3H5v-3Z"/></svg>
          </span>
          <span>Biblioth&egrave;que</span>
        </button>
        <button class="nav-item" data-route="explore" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m15.6 14.2 4.2 4.2-1.4 1.4-4.2-4.2a6.7 6.7 0 1 1 1.4-1.4ZM10.5 15a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z"/></svg>
          </span>
          <span>Explorer</span>
        </button>
        <button class="nav-item" data-route="calendar" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 3h2v2h6V3h2v2h2.5A1.5 1.5 0 0 1 21 6.5v12A1.5 1.5 0 0 1 19.5 20h-15A1.5 1.5 0 0 1 3 18.5v-12A1.5 1.5 0 0 1 4.5 5H7V3Zm12 7H5v8h14v-8Z"/></svg>
          </span>
          <span>Calendrier</span>
        </button>
        <button class="nav-item" data-route="profile" type="button">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 12.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.4 0-8 2.4-8 5.4V21h16v-1.1c0-3-3.6-5.4-8-5.4Z"/></svg>
          </span>
          <span>Profil</span>
        </button>
      </nav>
    </div>

    <dialog id="series-dialog" class="series-dialog">
      <form method="dialog" class="dialog-panel">
        <button class="dialog-close" value="close" aria-label="Fermer la fiche" type="submit">
          <span aria-hidden="true"></span>
        </button>
        <div id="dialog-content"></div>
      </form>
    </dialog>

    <script src="app.js" defer></script>
  </body>
</html>
